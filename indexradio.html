<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pachet</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #5A2A82;
    margin: 0;
    color: #fff;
}

/* TITLU */
h1 {
    margin: 50px 0;
    font-size: 5em;
    font-weight: bold;
    text-align: center;

    background: linear-gradient(135deg, #C08BFF, #5A2A82);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow:
        0 0 12px rgba(192,139,255,.8),
        0 0 22px rgba(246,183,60,.6);
}

/* 🔥 CONTAINER – DOAR ARANJARE (2 PE RÂND) */
.container {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 40px;
    padding: 40px;
    max-width: 1800px;
    margin: 0 auto;
    box-sizing: border-box;
}

/* BOX – centru pentru pachet */
.box {
    display: flex;
    justify-content: center;
}

/* 🔴 PACHET – FORMA RĂMÂNE LA FEL */
.package {
    display: flex;
    flex-direction: column;
    align-items: center;

    border: 2px solid #F6B73C;
    background-color: rgba(90, 42, 130, 0.4);
    border-radius: 14px;

    padding: 12px;
    width: 100%;
    max-width: 820px;   /* IMPORTANT – păstrează forma */
    box-sizing: border-box;

    box-shadow: 0 0 25px rgba(192, 139, 255, 0.6);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.package:hover {
    transform: scale(1.02);
    box-shadow:
        0 0 30px rgba(246, 183, 60, 0.9),
        0 0 55px rgba(192, 139, 255, 0.8);
}

/* IMAGINI – NU LE ATINGEM POZIȚIA */
.package img {
    border-radius: 10px;
    width: 100%;
    height: auto;
    object-fit: contain;
}

/* ZONA DE SUS – 2 imagini */
.package-images {
    display: flex;
    gap: 20px;
    width: 100%;
    justify-content: center;
    align-items: center;
}

/* DIMENSIUNI IMAGINI – CA ÎNAINTE */
.gif-img,
.pstylegif-img {
    width: 45%;
}

.pcback-img {
    margin-top: 18px;
    width: 95%;
}

/* TEXT */
.name {
    margin-top: 12px;
    color: #C08BFF;
    font-weight: bold;
    text-align: center;
}

.price {
    margin-top: 4px;
    color: #F6B73C;
    font-weight: bold;
    text-align: center;
}

/* RESPONSIVE */
@media (max-width: 1000px) {
    .container {
        grid-template-columns: 1fr;
    }

    .package {
        max-width: 95%;
    }
}

</style>
</head>

<body>

<h1>Pachets</h1>

<!-- 🔥 UN SINGUR CONTAINER -->

    <!-- EXEMPLU – PACHET 1 -->
        

     <div class="box">
