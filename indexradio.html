<!doctype html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie ❤️ GIF</title>

<style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0c1575; /* Fundal albastru închis */
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            min-height: 100vh;
            overflow-y: auto;
        }

        h1 {
            margin-top: 20px;
            color: #1E90FF; /* Albastru deschis */
            text-shadow: 0 0 10px rgba(30, 144, 255, 0.7); /* Glow albastru */
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(135deg, #1E90FF, #00008B); /* Tonuri de albastru */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 1.5s ease-in-out infinite;
        }

        h2 {
            color: #1E90FF; /* Albastru deschis */
            font-size: 2em;
            text-align: center;
            margin-top: 40px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px;
        }

        .gallery-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #00008B; /* Albastru închis */
            padding: 10px;
            background-color: rgba(0, 0, 139, 0.8); /* Albastru închis transparent */
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.7); /* Glow albastru */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(30, 144, 255, 1); /* Glow albastru mai intens */
        }

        .gallery-item img {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            transition: opacity 0.5s ease;
        }

        .gallery-item img:hover {
            opacity: 0.8;
        }

        .name {
            margin-top: 5px;
            color: #1E90FF; /* Albastru deschis */
            font-weight: bold;
            font-size: 1.1em;
            text-shadow: 0 0 5px rgba(30, 144, 255, 0.7); /* Glow albastru */
        }

        .price {
            margin-top: 10px;
            color: #1E90FF; /* Albastru deschis */
            font-weight: bold;
            font-size: 1.2em;
            text-shadow: 0 0 5px rgba(30, 144, 255, 0.7); /* Glow albastru */
        }

        @keyframes textGlow {
            0% { text-shadow: 0 0 5px rgba(30, 144, 255, 0.5); }
            50% { text-shadow: 0 0 15px rgba(30, 144, 255, 1); }
            100% { text-shadow: 0 0 5px rgba(30, 144, 255, 0.5); }
        }
    </style>

    
</head>

<h1>Pachet</h1>

        <div class="package"><div class="package-images"><img src="https://i.ibb.co/h1ZG1mcp/gif.gif" alt="Gif 1" class="gif-img"><img src="https://i.ibb.co/VcdNjztp/pstyle.gif" alt="PStyle Gif 1" class="pstylegif-img"></div><div><img src="https://i.ibb.co/fcfn93j/anigif.gif" alt="PCBack Gif 1" class="pcback-img"></div><div class="name">Pachet 2</div><div class="price">price: 2000 xats</div></div>    
        

        
    </div>
